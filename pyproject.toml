[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "txt2pptx"
version = "1.0.0"
description = "Turn text and documents into polished PowerPoint decks with LLMs - via web UI, CLI, or MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "txt2pptx contributors" }]
keywords = ["powerpoint", "pptx", "presentation", "llm", "mcp", "langchain"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "langchain-core>=1.7.7",
    "langchain-openai>=1.7.4",
    "langchain-anthropic>=1.7.10",
    "langchain-text-splitters>=1.1.3",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "pypdf>=7.1.0",
    "pypdfium2>=5.15.2",
    "pillow>=12.3.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.15.0",
    "pywin32>=312; sys_platform == 'win32'",
]

[project.optional-dependencies]
ui = ["gradio>=6.32.0"]
mcp = ["mcp>=2.3.0"]
all = ["txt2pptx[ui,mcp]"]

[project.scripts]
txt2pptx = "txt2pptx.cli:main"
txt2pptx-mcp = "txt2pptx.mcp_server:main"

[project.urls]
Documentation = "https://github.com/blackbyte7/txt2pptx#readme"
Issues = "https://github.com/blackbyte7/txt2pptx/issues"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/txt2pptx"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "C4", "PIE", "RET"]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess calls are deliberate and use fixed argv lists
    "S607",   # tool lookups via PATH are intentional (soffice)
    "RUF001", # ambiguous unicode in strings (bullet glyphs)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "B011", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:txt2pptx.*"]

[tool.coverage.run]
source = ["txt2pptx"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
